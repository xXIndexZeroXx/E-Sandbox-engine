# cargo-deny: fast Rust-side gate (licences, advisories, sources). ORT's evaluator is the full policy.
[graph]
targets = ["wasm32-unknown-unknown"]

[licenses]
confidence-threshold = 0.9
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Zlib", "Unicode-3.0", "Unlicense", "CC0-1.0", "0BSD"]

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "warn"
