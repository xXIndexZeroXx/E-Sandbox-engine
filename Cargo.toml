[package]
name = "esandbox-engine"
version = "0.1.0"
edition = "2024"
publish = false
license = "BSD-3-Clause"
description = "WebAssembly bindings for ngspice-rs, the simulator inside E-Sandbox"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned: ngspice-rs is 0.x and its API is not yet stable.
ngspice-rs = { git = "https://github.com/michaelnavazhylau/ngspice-rs", rev = "b9fc7bdcc91e7081a0c6a942f5dfaf4c2074a629" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

# Built from that revision with the fixes in patches/ applied: fetch-source.mjs puts the
# patched source in vendor/ngspice-rs.
[patch."https://github.com/michaelnavazhylau/ngspice-rs"]
ngspice-rs = { path = "vendor/ngspice-rs" }

[profile.release]
opt-level = 3
lto = true
